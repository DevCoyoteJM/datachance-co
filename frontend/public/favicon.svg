<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="25%" y1="20%" x2="75%" y2="80%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fondo circular oscuro (#0B0F19) con anillo verde esmeralda (#10B981) -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#10B981" stroke-width="2.5" />

  <!-- 3 rayas verticales de movimiento arriba -->
  <line x1="23" y1="12" x2="23" y2="18" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="9" x2="32" y2="17" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <line x1="41" y1="12" x2="41" y2="18" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />

  <!-- Balota de lotería esmeralda/blanca -->
  <circle cx="32" cy="39" r="17" fill="url(#ballGrad)" stroke="#047857" stroke-width="1" />
  
  <!-- Brillo especular 3D de la balota -->
  <ellipse cx="26" cy="29" rx="4.5" ry="2.5" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 26 29)" />

  <!-- Parche circular blanco central de la balota -->
  <circle cx="32" cy="39" r="9.5" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.75" />

  <!-- Número 7 nítido y centrado -->
  <text x="32" y="39.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#064E3B" text-anchor="middle" dominant-baseline="central">7</text>
</svg>
